spring:
  datasource:
    url: jdbc:h2:mem:saveus;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        use_nationalized_character_data: false
  cloud:
    discovery:
      enabled: false
  cache:
    type: none

eureka:
  client:
    enabled: false

saveus:
  jwt:
    chave: chave-de-teste-com-mais-de-32-caracteres-123456
  limite-auth:
    requisicoes: 1000
